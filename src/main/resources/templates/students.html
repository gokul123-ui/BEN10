<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Student Management</title>

    ```
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .top-buttons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .btn {
            padding: 10px 15px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
        }

        .add {
            background: #16a34a;
        }

        .delete-all {
            background: #dc2626;
        }

        form {
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .edit {
            background: #f59e0b;
        }

        .delete {
            background: #dc2626;
        }
    </style>
    ```

</head>

<body>

<div class="container">

    ```
    <h1>Student Management System</h1>

    <div class="top-buttons">

        <a href="/students/add" class="btn add">
            + Add Student
        </a>

        <a href="/students/delete-all"
           class="btn delete-all"
           onclick="return confirm('Are you sure you want to delete all students?')">
            Delete All
        </a>

    </div>


    <!-- Search by Roll Number -->

    <form action="/students/search" method="get">

        <input
                type="number"
                name="rno"
                placeholder="Enter Roll Number"
                required>

        <button type="submit">
            Search
        </button>

        <a href="/students" class="btn add">
            Show All
        </a>

    </form>


    <!-- Filter by Technology -->

    <form action="/students/technology" method="get">

        <input
                type="text"
                name="technology"
                placeholder="Enter Technology"
                required>

        <button type="submit">
            Filter
        </button>

    </form>


    <!-- Student Table -->

    <table>

        <thead>
        <tr>
            <th>Roll Number</th>
            <th>Name</th>
            <th>Gender</th>
            <th>Technology</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="student : ${students}">

            <td th:text="${student.rno}"></td>

            <td th:text="${student.name}"></td>

            <td th:text="${student.gender}"></td>

            <td th:text="${student.technology}"></td>

            <td>

                <a
                        th:href="@{/students/edit/{rno}(rno=${student.rno})}"
                        class="btn edit">
                    Edit
                </a>

                <a
                        th:href="@{/students/delete/{rno}(rno=${student.rno})}"
                        class="btn delete"
                        onclick="return confirm('Are you sure you want to delete this student?')">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>
    ```

</div>

</body>

</html>
